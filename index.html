const root=document.getElementById('questions');
function fmt(n){return Number(n.toFixed(3)).toString()}
const formulas={
'クーロンの法則':['F ＝ k q₁q₂ / r²','F：静電気力 [N]　q₁・q₂：電荷 [C]　r：距離 [m]　k＝9.0×10⁹ [N·m²/C²]'],
'ガウスの定理':['∮ E・dS ＝ Q/ε₀　　直線電荷：E＝2k₀λ/r　　無限平板：E＝σ/(2ε₀)','E：電界 [N/C]　λ：線電荷密度 [C/m]　σ：面電荷密度 [C/m²]　ε₀＝8.8×10⁻¹² [F/m]'],
'コンデンサ':['Q＝CV　　並列：C＝C₁＋C₂＋…　　直列：1/C＝1/C₁＋1/C₂＋…','Q：電荷 [C]　C：静電容量 [F]　V：電圧 [V]　※ pF・μF の単位変換に注意'],
'電磁誘導':['e＝Blv','e：誘導起電力 [V]　B：磁束密度 [T]　l：導線の長さ [m]　v：速度 [m/s]'],
'自己誘導':['|e|＝L|ΔI|/Δt','e：誘導起電力 [V]　L：自己インダクタンス [H]　ΔI：電流変化量 [A]　Δt：時間 [s]']};
function formulaPanel(c){let x=formulas[c];return `<section class="formulaBox"><h2>${c}で使う公式</h2><div class="formula">${x[0]}</div><div class="symbols">${x[1]}</div></section>`}
function capDiagram(q){

 // C1 and C2 in parallel
 if(q.text.includes('並列接続されている') && !q.text.includes('C₁とC₂は並列')){
   return `<div class="circuit"><svg viewBox="0 0 420 220" role="img" aria-label="C1とC2の並列接続図">
   <line x1="210" y1="20" x2="210" y2="45"/>
   <circle cx="210" cy="45" r="5" fill="#172334"/>

   <circle cx="210" cy="155" r="5" fill="#172334"/><line x1="210" y1="155" x2="210" y2="200"/>
   <text x="42" y="102">C₁</text><text x="350" y="102">C₂</text>
   </svg></div>`;
 }

 // C1/C2 parallel on top, C3/C4 parallel on bottom, matching user's reference.
 if(q.text.includes('C₁とC₂は並列')){
   return `<div class="circuit"><svg viewBox="0 0 440 430" role="img" aria-label="上段にC1とC2、下段にC3とC4を配置したコンデンサ回路図">

   <line x1="115" y1="195" x2="325" y2="195"/>
   <circle cx="115" cy="195" r="6" fill="#172334"/><circle cx="325" cy="195" r="6" fill="#172334"/>
   <line x1="115" y1="195" x2="115" y2="255"/><line x1="325" y1="195" x2="325" y2="255"/>
   <line class="plate" x1="88" y1="255" x2="142" y2="255"/><line class="plate" x1="88" y1="272" x2="142" y2="272"/>
   <line class="plate" x1="298" y1="255" x2="352" y2="255"/><line class="plate" x1="298" y1="272" x2="352" y2="272"/>
   <line x1="115" y1="272" x2="115" y2="340"/><line x1="325" y1="272" x2="325" y2="340"/>
   <line x1="115" y1="340" x2="325" y2="340"/>
   <circle cx="220" cy="340" r="6" fill="#172334"/><line x1="220" y1="340" x2="220" y2="405"/>
   <text x="45" y="130">C₁</text><text x="365" y="130">C₂</text>
   <text x="45" y="270">C₃</text><text x="365" y="270">C₄</text>
   </svg></div>`;
 }
 return '';
}

function makeSet(){let a=data.filter(q=>q.category===document.getElementById('unit').value);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}current=a.slice(0,Number(document.getElementById('count').value));show=false;document.getElementById('toggle').textContent='解答・解説を表示';document.getElementById('score').textContent='';render()}
function render(){root.innerHTML=formulaPanel(document.getElementById('unit').value);current.forEach((q,i)=>{let c=document.createElement('section');c.className='q';c.innerHTML=`<h3>問${i+1}</h3><div class="text">${q.text}</div>${capDiagram(q)}<div class="givens"><b>与えられた値</b><br>${q.givens.join('　／　')}</div><div class="answer"><input inputmode="decimal" data-i="${i}" placeholder="数値を入力"><span>${q.unit}</span></div><div class="result" id="r${i}"></div><div class="explain" id="e${i}"><b>計算式：</b>${q.formula}<br><b>計算結果：</b>${fmt(q.answer)} ${q.unit}<br><b>答え：</b>${fmt(q.answer)} ${q.unit}</div>`;root.appendChild(c)})}
document.getElementById('new').addEventListener('click',makeSet);document.getElementById('unit').addEventListener('change',makeSet);document.getElementById('count').addEventListener('change',makeSet);
document.getElementById('check').addEventListener('click',()=>{let n=0;current.forEach((q,i)=>{let x=document.querySelector(`[data-i="${i}"]`),v=Number(x.value),r=document.getElementById('r'+i),ok=x.value.trim()!==''&&Math.abs(v-q.answer)<1e-9;if(ok){n++;r.textContent='正解';r.className='result ok'}else{r.textContent=x.value.trim()===''?'未入力':'不正解';r.className='result ng'}});document.getElementById('score').textContent=`${n} / ${current.length}問正解`});
document.getElementById('toggle').addEventListener('click',()=>{show=!show;current.forEach((q,i)=>document.getElementById('e'+i).style.display=show?'block':'none');document.getElementById('toggle').textContent=show?'解答・解説を隠す':'解答・解説を表示'});
makeSet();
</script></body></html>
