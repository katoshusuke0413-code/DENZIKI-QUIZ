let current=[],show=false;
const root=document.getElementById('questions');
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function makeSet(){
 const selected=document.getElementById('unit').value;
 const n=Number(document.getElementById('count').value);
 let candidates=pools.flat().filter(q=>q.category===selected);
 if(candidates.length===0){
   root.innerHTML='<section class="q"><b>この単元の問題データが見つかりません。</b></section>';
   current=[];
   return;
 }
 // shuffle selected unit's variants
 for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}
 current=candidates.slice(0,Math.min(n,candidates.length));
 show=false;
 document.getElementById('toggle').textContent='解答・解説を表示';
 document.getElementById('score').textContent='';
 render();
}
function render(){
 root.innerHTML='';
 let previousCategory='';
 current.forEach((q,i)=>{
  if(q.category!==previousCategory){
   const heading=document.createElement('h2');
   heading.textContent=q.category;
   heading.style.cssText='font-size:1.15rem;color:#183b67;margin:22px 2px 10px;padding:0 0 7px;border-bottom:2px solid #b8cce4';
   root.appendChild(heading);
   previousCategory=q.category;
  }
  const card=document.createElement('section');card.className='q';
  const h=document.createElement('h3');h.textContent=`問${i+1}`;card.appendChild(h);
  const p=document.createElement('div');p.className='text';p.textContent=q.text;card.appendChild(p);
  const g=document.createElement('div');g.className='givens';const b=document.createElement('b');b.textContent='与えられた値';g.appendChild(b);
  const vals=document.createElement('div');vals.textContent=q.givens.join('　／　');g.appendChild(vals);card.appendChild(g);
  const a=document.createElement('div');a.className='answer';const inp=document.createElement('input');inp.type='text';inp.inputMode='decimal';inp.placeholder='数値を入力';inp.dataset.i=i;a.appendChild(inp);const u=document.createElement('span');u.className='unit';u.textContent=q.unit;a.appendChild(u);card.appendChild(a);
  const r=document.createElement('div');r.className='result';r.id='r'+i;card.appendChild(r);
  const e=document.createElement('div');
e.className='explain';e.id='e'+i;
const ans=(Math.abs(q.answer)>=0.001 && Math.abs(q.answer)<1000000)
 ? Number(q.answer.toPrecision(10)).toString()
 : q.answer.toExponential(6).replace(/\.0+e/,'e');
e.innerHTML='<b>計算式：</b>'+q.explain+'。<br><b>計算結果：</b>'+ans+' '+q.unit+'<br><b>答え：</b>'+ans+' '+q.unit;
if(show)e.style.display='block';
card.appendChild(e);root.appendChild(card);
 });
}
document.getElementById('new').addEventListener('click',makeSet);
document.getElementById('count').addEventListener('change',makeSet);
document.getElementById('unit').addEventListener('change',makeSet);
document.getElementById('check').addEventListener('click',()=>{
 let c=0;current.forEach((q,i)=>{const x=document.querySelector(`input[data-i="${i}"]`),v=Number(x.value.trim()),ok=x.value.trim()!==''&&Number.isFinite(v)&&Math.abs(v-q.answer)<=Math.max(1e-8,Math.abs(q.answer)*1e-4);const r=document.getElementById('r'+i);if(ok){c++;r.textContent='正解';r.className='result ok'}else{r.textContent=x.value.trim()===''?'未入力':'不正解';r.className='result ng'}});document.getElementById('score').textContent=`${c} / ${current.length}問正解`;
});
document.getElementById('toggle').addEventListener('click',()=>{show=!show;current.forEach((q,i)=>{const e=document.getElementById('e'+i);e.style.display=show?'block':'none'});document.getElementById('toggle').textContent=show?'解答・解説を隠す':'解答・解説を表示'});
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[data-i]').forEach(x=>x.value='');document.querySelectorAll('.result').forEach(x=>{x.textContent='';x.className='result'});document.getElementById('score').textContent=''});
makeSet();
</script></body></html>
